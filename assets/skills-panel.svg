<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="360" fill="#07090D"/>
<text x="32" y="42" fill="#8FF5D0" font-size="11" font-family="monospace" letter-spacing="2">KỸ NĂNG CHÍNH</text>
<text x="32" y="98" fill="#F3F7F5" font-size="46" font-weight="800" font-family="sans-serif">CÔNG CỤ &amp;</text>
<text x="32" y="145" fill="#F3F7F5" font-size="46" font-weight="800" font-family="sans-serif">CHUYÊN MÔN.</text>
<text x="620" y="82" fill="#AEB8C1" font-size="14" font-family="sans-serif">Tôi tập trung vào gameplay rõ ràng, giao diện dễ sử dụng</text>
<text x="620" y="105" fill="#AEB8C1" font-size="14" font-family="sans-serif">và phản hồi trực quan giúp trải nghiệm game tốt hơn.</text>
<rect x="32" y="190" width="270" height="125" rx="18" fill="#0B1118" stroke="#FFFFFF17"/>
<text x="52" y="226" fill="#F3F7F5" font-size="20" font-weight="700" font-family="sans-serif">Unity</text>
<text x="52" y="254" fill="#AEB8C1" font-size="12" font-family="sans-serif">Phát triển game 2D/3D</text>
<text x="52" y="274" fill="#AEB8C1" font-size="12" font-family="sans-serif">và triển khai gameplay.</text>
<rect x="320" y="190" width="270" height="125" rx="18" fill="#0B1118" stroke="#FFFFFF17"/>
<text x="340" y="226" fill="#F3F7F5" font-size="20" font-weight="700" font-family="sans-serif">C#</text>
<text x="340" y="254" fill="#AEB8C1" font-size="12" font-family="sans-serif">Logic gameplay, hệ thống</text>
<text x="340" y="274" fill="#AEB8C1" font-size="12" font-family="sans-serif">và công cụ hỗ trợ.</text>
<rect x="608" y="190" width="270" height="125" rx="18" fill="#0B1118" stroke="#FFFFFF17"/>
<text x="628" y="226" fill="#F3F7F5" font-size="20" font-weight="700" font-family="sans-serif">Hệ thống gameplay</text>
<text x="628" y="254" fill="#AEB8C1" font-size="12" font-family="sans-serif">Điều khiển, tương tác, chiến đấu,</text>
<text x="628" y="274" fill="#AEB8C1" font-size="12" font-family="sans-serif">trạng thái và tiến trình.</text>
<rect x="896" y="190" width="270" height="125" rx="18" fill="#0B1118" stroke="#FFFFFF17"/>
<text x="916" y="226" fill="#F3F7F5" font-size="20" font-weight="700" font-family="sans-serif">UI</text>
<text x="916" y="254" fill="#AEB8C1" font-size="12" font-family="sans-serif">Thiết kế và triển khai giao diện</text>
<text x="916" y="274" fill="#AEB8C1" font-size="12" font-family="sans-serif">phục vụ trải nghiệm game.</text>
</svg>